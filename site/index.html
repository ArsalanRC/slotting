<title data-i18n="meta.title">slotting · the picker walks one route, not many</title>
<meta name="description" content="Ranking SKUs by pick frequency optimises the sum of distances. A picker walks one route per order. Watch the difference on a warehouse floor, in English and German." />
<meta name="theme-color" content="#1C1A17" />

<link rel="stylesheet" href="./style.css" />
<script>
  // Before first paint: no theme flash, no language flash. Inline on purpose.
  (function () {
    var p = "slotting", t = null, l = null;
    try { t = localStorage.getItem(p + "-theme"); l = localStorage.getItem(p + "-lang"); } catch (e) {}
    document.documentElement.dataset.theme =
      t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.lang =
      l || ((navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en");
  })();
</script>
</head>

<main id="top">

  <section class="hero">
    <p class="kicker" data-i18n="hero.kicker">Python 3.10+ · zero dependencies · a warehouse floor</p>
    <h1 class="hero-title" data-i18n-html="hero.title"></h1>
    <p class="lede" data-i18n="hero.lede"></p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="https://github.com/ArsalanRC/slotting" target="_blank" rel="noopener" data-i18n="hero.cta">Read the code</a>
      <code class="install">pip install git+https://github.com/ArsalanRC/slotting.git</code>
    </div>
    <div class="rule" aria-hidden="true"><i></i><i></i></div>
  </section>

  <!-- ================================================== one route, not many -->
  <section class="band">
    <p class="eyebrow" data-i18n="route.eyebrow"></p>
    <h2 data-i18n="route.title"></h2>
    <p class="body" data-i18n="route.lede"></p>

    <div class="scene">
      <div class="scene-bar">
        <button type="button" class="btn" id="route-play" data-i18n="route.play">Walk the order</button>
        <span class="grow"></span>
        <span class="tally" id="route-tally"></span>
      </div>
      <div class="floor-wrap">
        <div class="floor-col">
          <span class="floor-label" data-i18n="route.byFrequency">By pick frequency</span>
          <svg id="floor-before" class="floor" role="img" aria-labelledby="fb-t"><title id="fb-t" data-i18n="route.byFrequency">By pick frequency</title></svg>
        </div>
        <div class="floor-col">
          <span class="floor-label" data-i18n="route.optimised">Optimised</span>
          <svg id="floor-after" class="floor" role="img" aria-labelledby="fa-t"><title id="fa-t" data-i18n="route.optimised">Optimised</title></svg>
        </div>
      </div>
    </div>
    <p class="caption" data-i18n="route.caption"></p>

    <div class="note">
      <strong data-i18n="route.noteTitle"></strong>
      <p data-i18n="route.noteBody"></p>
    </div>
  </section>

  <!-- ============================================================== heatmap -->
  <section class="band">
    <p class="eyebrow" data-i18n="heat.eyebrow"></p>
    <h2 data-i18n="heat.title"></h2>
    <p class="body" data-i18n="heat.lede"></p>

    <div class="scene">
      <div class="scene-bar">
        <button type="button" class="switch" id="heat-toggle" aria-pressed="false">
          <span class="track" aria-hidden="true"></span>
          <span data-i18n="heat.switch">Show the optimised floor</span>
        </button>
        <span class="grow"></span>
        <span class="tally" id="heat-tally"></span>
      </div>
      <div class="heat-wrap">
        <svg id="heat" class="floor floor-wide" role="img" aria-labelledby="h-t"><title id="h-t" data-i18n="heat.title">Pick density across the floor</title></svg>
        <div class="legend">
          <span data-i18n="heat.cold">quiet</span>
          <i class="ramp" aria-hidden="true"></i>
          <span data-i18n="heat.hot">busy</span>
        </div>
      </div>
    </div>
    <p class="caption" data-i18n="heat.caption"></p>
  </section>

  <!-- ============================================================ the limits -->
  <section class="band">
    <p class="eyebrow" data-i18n="limits.eyebrow"></p>
    <h2 data-i18n="limits.title"></h2>
    <div class="split">
      <div class="card">
        <h3 data-i18n="limits.c1t"></h3>
        <p data-i18n="limits.c1b"></p>
      </div>
      <div class="card">
        <h3 data-i18n="limits.c2t"></h3>
        <p data-i18n="limits.c2b"></p>
      </div>
      <div class="card">
        <h3 data-i18n="limits.c3t"></h3>
        <p data-i18n="limits.c3b"></p>
      </div>
    </div>
  </section>

</main>
